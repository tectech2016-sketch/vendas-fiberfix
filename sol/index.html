<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendas Sol Nascente</title>
<script>
(async () => { try { if ("serviceWorker" in navigator) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.filter(r => /\/sol\/$/.test(r.scope)).map(r => r.unregister())); }
  if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.filter(k => /^sol-v/.test(k)).map(k => caches.delete(k))); } } catch (e) { }
  location.replace("https://tectech2016-sketch.github.io/vendas-solnascente/"); })();
</script></head><body style="font-family:sans-serif;padding:24px">O app da Sol Nascente mudou de endereço: <a href="https://tectech2016-sketch.github.io/vendas-solnascente/">abrir</a>.</body></html>
